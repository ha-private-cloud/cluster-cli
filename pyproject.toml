[project]
name = "cluster-cli"
version = "0.1.0"
description = "CLI for building apps via cluster-ci's in-cluster runner, deploying them locally via helm, and running tofu across this project's repos"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.1.0",
    "requests>=2.32.0",
    "pathspec>=0.12.0",
]

[project.scripts]
cluster-cli = "cluster_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.0.0"]
