[project]
name = "ci-cli"
version = "0.1.0"
description = "CLI for the cluster-ci in-cluster build/test/push/deploy runner"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.1.0",
    "requests>=2.32.0",
    "pathspec>=0.12.0",
]

[project.scripts]
ci-cli = "ci_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.0.0"]
